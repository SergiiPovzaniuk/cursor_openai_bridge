<!doctype html>
<html>
<head><meta charset="utf-8"><title>test</title></head>
<body>
<div id="status">connecting...</div>
<div id="log" style="font:11px monospace;white-space:pre-wrap;max-height:80vh;overflow:auto"></div>
<script>
(function () {
  const state = { token: window.__cursorToken || "", conn: window.__cursorConnId || "default" };
  const BASE = (window.__cursorRelayUrl || (location.origin + "/relay")).replace(/\/$/, "");
  let connected = false;

  function setStatus(s) {
    const el = document.getElementById("status");
    if (el) el.textContent = s;
  }

  function log(line) {
    const el = document.getElementById("log");
    if (!el) return;
    el.textContent = (new Date().toISOString() + " " + line + "\n" + el.textContent).slice(0, 20000);
  }

  function deliver(frame) {
    if (typeof window.javaPush === "function") {
      window.javaPush(JSON.stringify(frame));
    }
  }

  function qs() {
    return "?conn=" + encodeURIComponent(state.conn);
  }

  async function pollLoop() {
    while (true) {
      try {
        const res = await fetch(BASE + "/poll" + qs(), {
          cache: "no-store",
          headers: { "X-Relay-Token": state.token },
        });
        if (!res.ok) throw new Error("poll " + res.status);
        const body = await res.json();
        setStatus("connected");
        if (!connected) deliver({ k: "hello" });
        connected = true;
        for (const frame of body.frames || []) deliver(frame);
      } catch (e) {
        if (connected) deliver({ k: "status", ready: false });
        connected = false;
        setStatus("disconnected, retrying...");
        await new Promise((r) => setTimeout(r, 1000));
      }
    }
  }

  window.__cursorTx = async function (jsonStr) {
    const res = await fetch(BASE + "/send" + qs(), {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Relay-Token": state.token },
      body: jsonStr,
    });
    if (!res.ok) throw new Error("send " + res.status);
    return true;
  };

  window.__cursorConnect = pollLoop;
  pollLoop();
})();
</script>
</body>
</html>
