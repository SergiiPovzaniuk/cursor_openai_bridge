[project]
name = "cursor-openai-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cursor-sdk>=1.0.31",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
